[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Packaging exists only so `pip install -e . --no-deps` makes `ml` and `app` importable
# from anywhere. Dependencies are pinned in backend/requirements.txt (single source).
[project]
name = "neo-guard"
version = "0.1.0"
description = "Explainable ML for Near-Earth Object classification and close-approach analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = [".", "backend"]
include = ["ml*", "app*"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a PostgreSQL server (set TEST_DATABASE_URL); skipped otherwise",
]
filterwarnings = [
    "ignore::DeprecationWarning:shap.*",
    "ignore::FutureWarning:shap.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiom: Depends()/Query()/Path() as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
